<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayVerse Admin</title><link rel="stylesheet" href="/admin-v11.css?v=11.0.0"></head><body><main><header><div><span>PLAYVERSE</span><h1>Live Admin</h1><p>No password. Permanent changes are still made in GitHub.</p></div><a href="/">Open Game</a></header><section class="grid"><article><h2>Game Settings</h2><form id="settingsForm"><label>Maximum players<input id="maxPlayers" type="number" min="2" max="6"></label><label>Minimum players<input id="minPlayers" type="number" min="2" max="6"></label><label>Sticker popup ms<input id="stickerPopupMs" type="number" min="1000" max="6000"></label><label>Sticker cooldown ms<input id="stickerCooldownMs" type="number" min="300" max="5000"></label><label class="check"><input id="exactRollToWin" type="checkbox"> Exact roll to reach 100</label><label class="check"><input id="extraTurnOnSix" type="checkbox"> Extra turn on 6</label><label class="check"><input id="soundDefaultOn" type="checkbox"> Sound on by default</label><button>Apply Live Settings</button></form></article><article><h2>Live Rooms</h2><div id="rooms"></div></article></section><section class="stickers"><h2>Meme Stickers</h2><p>Enable/disable or rename for the current running server.</p><div id="stickerList"></div></section><p id="status"></p></main><script src="/admin-v11.js?v=11.0.0"></script></body></html>
