services:
  - type: web
    name: playverse-multiplayer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: playverse-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PUBLIC_BUSINESS_NAME
        value: Quartz Web Solutions
      - key: PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: PUBLIC_SUPPORT_PHONE
        sync: false
      - key: PUBLIC_BUSINESS_ADDRESS
        sync: false

databases:
  - name: playverse-db
    plan: free
